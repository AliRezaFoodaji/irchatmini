services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_ICE_SERVERS: ${NEXT_PUBLIC_ICE_SERVERS:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:3001/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TURN/STUN server — required so users behind NAT can connect.
  # Uses host networking because WebRTC relays need a wide UDP port range.
  coturn:
    image: coturn/coturn:4.6.2
    network_mode: host
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

