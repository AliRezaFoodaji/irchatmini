# coturn configuration for the hamsabhat relay
listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Relay port range (allow it in your firewall too)
min-port=49152
max-port=65535

fingerprint
lt-cred-mech

# === EDIT THESE ===
# Username/password must match NEXT_PUBLIC_ICE_SERVERS in your .env
user=hamsabhat:CHANGE_ME_TURN_PASSWORD
realm=your-domain.com

# If the VPS is behind NAT, set its public IP:
# external-ip=PUBLIC_IP_OF_VPS

# Do not relay for private networks (basic abuse protection)
denied-peer-ip=10.0.0.0/8
denied-peer-ip=172.16.0.0/12
denied-peer-ip=192.168.0.0/16
denied-peer-ip=127.0.0.1
allowed-peer-ip=0.0.0.0/0

log-file=stdout
no-tls
no-dtls
no-cli