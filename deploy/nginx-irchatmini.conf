# ============================================================
# hamsabhat / irchatmini — sub-path locations
#
# DO NOT drop this file directly into /etc/nginx/conf.d/ — `location`
# is only valid inside a server{} block, and conf.d/*.conf is included
# at http level. Instead:
#
#   1. sudo cp deploy/nginx-irchatmini.conf /etc/nginx/conf.d/irchatmini-locations.conf
#   2. Add ONE include line inside the alirezafoodaji.ir 443 server block
#      (right after its `server_name` line) in:
#        /etc/nginx/sites-enabled/webme
#      include /etc/nginx/conf.d/irchatmini-locations.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# This keeps sub-path handling running INSIDE the main site's own SSL
# server{} — nothing else about the main site changes.
#
# Uses `^~` so these prefix locations beat the main site's regex
# locations (static assets etc.) for anything under /p/irchatmini.
# Container host ports: web=3123, signal=3124.
# ============================================================

# WebSocket signaling endpoint -> signaling server (3124).
location ^~ /p/irchatmini/ws-signal {
    proxy_pass http://127.0.0.1:3124;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Everything else under the sub-path -> Next.js app (3123).
location ^~ /p/irchatmini/ {
    proxy_pass http://127.0.0.1:3123;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Bare prefix without a trailing slash -> pretty URL.
location = /p/irchatmini {
    return 301 /p/irchatmini/;
}