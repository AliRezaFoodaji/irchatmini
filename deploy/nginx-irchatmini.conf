# ============================================================
# hamsabhat / irchatmini — sub-path deployment
# Put this file in  /etc/nginx/conf.d/irchatmini.conf
# Loaded inside the default server{} (http context) — the main
# alirezafoodaji.ir site keeps its own config untouched.
#
#   sudo cp deploy/nginx-irchatmini.conf /etc/nginx/conf.d/irchatmini.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires the Docker services (web:3123, signal:3124) running.
#
# NOTE: uses `^~` so these prefix locations beat the main site's
# regex locations (e.g. static assets) for anything under /p/irchatmini.
# ============================================================

# WebSocket signaling endpoint -> signaling server (3124).
location ^~ /p/irchatmini/ws-signal {
    proxy_pass http://127.0.0.1:3124;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Everything else under the sub-path -> Next.js app (3123).
location ^~ /p/irchatmini/ {
    proxy_pass http://127.0.0.1:3123;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Bare prefix without a trailing slash -> pretty URL.
location = /p/irchatmini {
    return 301 /p/irchatmini/;
}